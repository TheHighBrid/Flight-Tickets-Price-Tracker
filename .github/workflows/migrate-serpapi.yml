name: Migrate flight provider to SerpApi

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-serpapi.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-serpapi-provider
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Correct migration target after enum rename
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate_to_serpapi.py')
          text = path.read_text(encoding='utf-8')
          old = '''                                : ProviderConfig.Mode.AMADEUS_DIRECT,\n                        environment.getSelectedItemPosition()'''
          new = '''                                : ProviderConfig.Mode.SERPAPI_DIRECT,\n                        environment.getSelectedItemPosition()'''
          if old not in text:
              raise SystemExit('Expected migration target was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply provider migration
        run: python scripts/migrate_to_serpapi.py

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git commit -m "Replace Amadeus with free SerpApi Google Flights provider"
          git push origin HEAD:main
